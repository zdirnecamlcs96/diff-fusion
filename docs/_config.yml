title: diff-fusion
description: "Two-way reconciliation between authoritative systems."
url: "https://zdirnecamlcs96.github.io"
baseurl: "/diff-fusion"

theme: just-the-docs
plugins:
  - jekyll-seo-tag

color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 3

mermaid:
  version: "10.9.1"

aux_links:
  "GitHub":
    - "https://github.com/zdirnecamlcs96/diff-fusion"
aux_links_new_tab: true

nav_external_links:
  - title: "Rust API (rustdoc)"
    url: "/diff-fusion/api/rust/"
  - title: "TypeScript API (typedoc)"
    url: "/diff-fusion/api/ts/"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

exclude:
  - superpowers/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - preview.nginx.conf
