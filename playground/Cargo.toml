[package]
name = "playground"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "playground"
path = "src/main.rs"

[dependencies]
diff_fusion = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
