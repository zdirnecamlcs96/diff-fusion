[package]
edition = "2024"
name = "diff_fusion"
version = "0.1.0"

[lib]
crate-type = ["rlib"]
name = "diff_fusion"
path = "src/lib.rs"

[[bin]]
name = "diff-fusion"
path = "src/main.rs"

[dependencies]
clap = {version = "4", features = ["derive"]}
colored = "3"
serde = {version = "1", features = ["derive"]}
serde_json = "1"

# Integration tests - each file is a separate test target
[[test]]
name = "transform_tests"
path = "tests/integration/transform_tests.rs"

[[test]]
name = "compare_tests"
path = "tests/integration/compare_tests.rs"

[[test]]
name = "end_to_end_tests"
path = "tests/integration/end_to_end_tests.rs"
